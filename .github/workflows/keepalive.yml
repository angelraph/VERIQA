name: Keep Veriga awake and run the daily job

# Render's free plan sleeps a service after 15 idle minutes. A light ping every
# 10 minutes keeps the site instant for shop owners and judges. Once a day the
# same workflow runs the daily job (chain sync, score checkpoints, Monday notes).
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check
        run: curl -fsS --max-time 90 https://veriga.xyz/api/health || curl -fsS --max-time 90 https://veriga.xyz/api/health
      - name: Daily job
        if: github.event.schedule == '10 0 * * *' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET repo secret not set, skipping daily job"; exit 0; fi
          curl -fsS --max-time 280 -H "Authorization: Bearer $CRON_SECRET" https://veriga.xyz/api/cron/daily
